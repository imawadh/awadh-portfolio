version: 1
frontend:
  phases:
    preBuild:
      commands:
        # package.json requires Node >= 22.12; Amplify's default image ships an older version
        - nvm install 22.12.0
        - nvm use 22.12.0
        - node --version
        - npm ci --no-audit --no-fund
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - ~/.npm/**/*
